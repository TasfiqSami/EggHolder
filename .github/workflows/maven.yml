# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: EggHolder CI and Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      package_version:
        description: "Stable Maven version to publish (for example 2.2.2); leave blank for a unique CI version."
        required: false
        type: string

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        paper-api: [ '1.20.6-R0.1-SNAPSHOT', '1.21.11-R0.1-SNAPSHOT' ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean -Dpaper.version=${{ matrix.paper-api }} verify --file pom.xml

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21 and GitHub Packages credentials
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish Maven package
        run: |
          BASE_VERSION=$(sed -n 's/.*<revision>\(.*\)<\/revision>.*/\1/p' pom.xml | head -n 1)
          if [ -n "$PACKAGE_VERSION" ]; then
            if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
              echo "Invalid package_version: use a semantic version such as ${BASE_VERSION}."
              exit 1
            fi
            VERSION_TO_PUBLISH="$PACKAGE_VERSION"
          else
            VERSION_TO_PUBLISH="${BASE_VERSION}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          mvn --batch-mode --no-transfer-progress deploy "-Drevision=${VERSION_TO_PUBLISH}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
