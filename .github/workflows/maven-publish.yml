# Publishes a uniquely versioned Maven artifact to GitHub Packages on every branch push.
# Can also be started manually from Actions.

name: Maven Package

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  publish:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 and GitHub Packages credentials
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish Maven package
        run: mvn --batch-mode --no-transfer-progress deploy "-Drevision=2.1.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
