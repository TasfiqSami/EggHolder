# Publishes the Maven artifact to GitHub Packages on each GitHub release.
# Can also be started manually from Actions for an existing release.

name: Maven Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 and GitHub Packages credentials
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish Maven package
        run: mvn --batch-mode --no-transfer-progress deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
